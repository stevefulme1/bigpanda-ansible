---
- name: BigPanda Alert Automation
  hosts: all
  sources:
    - bigpanda.incident.bigpanda_webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Critical alert received
      condition: event.payload.status == "critical"
      action:
        run_playbook:
          name: remediate_critical.yml
    - name: Alert resolved
      condition: event.payload.status == "ok"
      action:
        debug:
          msg: "Alert {{ event.payload.alert_id }} resolved"
    - name: Alert changed
      condition: event.payload is defined
      action:
        debug:
          msg: "BigPanda event received: {{ event.payload.status | default('unknown') }}"
