---
# BigPanda Alert Automation via EDA Gateway
#
# Prerequisites:
#   1. Configure an External Event Stream in EDA Controller
#   2. Point BigPanda webhook to the Gateway URL:
#      https://<eda-gateway>/api/eda/v1/external_event_stream/<stream-id>/post/
#   3. Configure webhook credentials in EDA Controller (not in this rulebook)
#
- name: BigPanda Alert Automation
  hosts: all
  sources:
    - bigpanda.incident.bigpanda_webhook:
        event_filter:
          - critical
          - warning
  rules:
    - name: Critical alert received
      condition: event.payload.status == "critical"
      action:
        run_playbook:
          name: remediate_critical.yml
    - name: Alert resolved
      condition: event.payload.status == "ok"
      action:
        debug:
          msg: "Alert {{ event.payload.alert_id | default('unknown') }} resolved"
    - name: Alert changed
      condition: event.payload is defined
      action:
        debug:
          msg: "BigPanda event: {{ event.payload.status | default('unknown') }}"
